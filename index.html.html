<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Base de connaissances — eSupplier / SPM</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-background-primary: #ffffff;
    --color-background-secondary: #f5f5f3;
    --color-text-primary: #1a1a18;
    --color-text-secondary: #6b6b67;
    --color-border-tertiary: rgba(0,0,0,0.12);
    --color-border-secondary: rgba(0,0,0,0.25);
    --color-border-primary: rgba(0,0,0,0.35);
    --font-sans: system-ui, -apple-system, sans-serif;
    --border-radius-md: 8px;
    --border-radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-background-primary: #1e1e1c;
      --color-background-secondary: #2a2a28;
      --color-text-primary: #f0efea;
      --color-text-secondary: #9e9e98;
      --color-border-tertiary: rgba(255,255,255,0.1);
      --color-border-secondary: rgba(255,255,255,0.2);
      --color-border-primary: rgba(255,255,255,0.3);
    }
  }
  body { font-family: var(--font-sans); background: var(--color-background-secondary); color: var(--color-text-primary); min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 1.5rem; }

  .tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .tab { padding: 8px 16px; font-size: 14px; font-weight: 500; color: var(--color-text-secondary); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s; }
  .tab.active { color: var(--color-text-primary); border-bottom: 2px solid var(--color-text-primary); }
  .tab:hover:not(.active) { color: var(--color-text-primary); }
  .view { display: none; }
  .view.active { display: block; }

  .metric-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.5rem; }
  .metric { background: var(--color-background-primary); border-radius: var(--border-radius-md); padding: 1rem; border: 0.5px solid var(--color-border-tertiary); }
  .metric-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .metric-value { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }

  .problem-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-bottom: 12px; cursor: pointer; transition: border-color 0.15s; }
  .problem-card:hover { border-color: var(--color-border-secondary); }
  .problem-card.expanded { border-color: var(--color-border-primary); }
  .card-header { display: flex; align-items: flex-start; gap: 12px; }
  .cat-badge { font-size: 11px; padding: 3px 8px; border-radius: var(--border-radius-md); white-space: nowrap; font-weight: 500; flex-shrink: 0; }
  .cat-access { background: #E6F1FB; color: #0C447C; }
  .cat-spm { background: #EEEDFE; color: #3C3489; }
  .cat-compte { background: #E1F5EE; color: #085041; }
  .cat-autre { background: #F1EFE8; color: #444441; }
  .card-title { font-size: 14px; font-weight: 500; color: var(--color-text-primary); flex: 1; line-height: 1.4; }
  .card-meta { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  .card-stat { font-size: 12px; color: var(--color-text-secondary); }
  .card-stat span { font-weight: 500; color: var(--color-text-primary); }
  .expand-icon { font-size: 14px; color: var(--color-text-secondary); transition: transform 0.2s; flex-shrink: 0; }
  .problem-card.expanded .expand-icon { transform: rotate(180deg); }
  .card-body { display: none; margin-top: 1rem; border-top: 0.5px solid var(--color-border-tertiary); padding-top: 1rem; }
  .problem-card.expanded .card-body { display: block; }
  .section-label { font-size: 12px; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; margin-top: 12px; }
  .section-label:first-child { margin-top: 0; }
  .solution-step { display: flex; gap: 10px; margin-bottom: 8px; font-size: 13px; line-height: 1.5; color: var(--color-text-primary); }
  .step-num { width: 20px; height: 20px; border-radius: 50%; background: #EEEDFE; color: #3C3489; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .note-box { background: #FAEEDA; border-radius: var(--border-radius-md); padding: 10px 12px; font-size: 13px; color: #633806; line-height: 1.5; margin-top: 8px; }

  .search-row { display: flex; gap: 10px; margin-bottom: 1rem; }
  .search-row input { flex: 1; font-size: 14px; padding: 8px 12px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); outline: none; }
  .search-row input:focus { border-color: var(--color-border-secondary); }
  .filter-select { width: 180px; font-size: 14px; padding: 8px 12px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); outline: none; }
  .empty { text-align: center; padding: 2rem; color: var(--color-text-secondary); font-size: 14px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
  .form-field { display: flex; flex-direction: column; gap: 6px; }
  .form-field.full { grid-column: 1 / -1; }
  .form-field label { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); }
  .form-field input, .form-field select, .form-field textarea { width: 100%; font-size: 14px; padding: 8px 12px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); outline: none; font-family: var(--font-sans); }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--color-border-secondary); }
  .form-field textarea { height: 80px; resize: vertical; }
  .step-builder { border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 10px 12px; margin-bottom: 8px; background: var(--color-background-primary); }
  .step-builder-row { display: flex; gap: 8px; align-items: center; }
  .step-builder-row input { flex: 1; }
  .btn-remove { background: none; border: none; color: var(--color-text-secondary); cursor: pointer; font-size: 18px; padding: 0 4px; line-height: 1; }
  .btn-remove:hover { color: #E24B4A; }
  .btn-add { font-size: 13px; color: var(--color-text-secondary); background: none; border: 0.5px dashed var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 8px 12px; cursor: pointer; width: 100%; margin-bottom: 1rem; font-family: var(--font-sans); }
  .btn-add:hover { background: var(--color-background-secondary); }
  .btn-primary { background: var(--color-text-primary); color: var(--color-background-primary); border: none; padding: 10px 24px; border-radius: var(--border-radius-md); font-size: 14px; font-weight: 500; cursor: pointer; font-family: var(--font-sans); }
  .btn-primary:hover { opacity: 0.85; }
  .success-msg { background: #EAF3DE; color: #27500A; border-radius: var(--border-radius-md); padding: 12px 16px; font-size: 14px; margin-top: 12px; display: none; }

  .diag-step { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; }
  .diag-question { font-size: 16px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 1rem; }
  .diag-options { display: flex; flex-direction: column; gap: 8px; }
  .diag-opt { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); cursor: pointer; font-size: 14px; color: var(--color-text-primary); background: var(--color-background-primary); transition: border-color 0.15s, background 0.15s; font-family: var(--font-sans); text-align: left; }
  .diag-opt:hover { border-color: var(--color-border-secondary); background: var(--color-background-secondary); }
  .diag-opt-icon { width: 8px; height: 8px; border-radius: 50%; background: var(--color-border-secondary); flex-shrink: 0; }
  .diag-result { background: #EEEDFE; border-radius: var(--border-radius-lg); padding: 1.25rem; margin-top: 1rem; }
  .diag-result-title { font-size: 15px; font-weight: 500; color: #3C3489; margin-bottom: 10px; }
  .diag-back { font-size: 13px; color: var(--color-text-secondary); background: none; border: none; cursor: pointer; padding: 0; margin-top: 12px; display: block; font-family: var(--font-sans); }
  .diag-back:hover { color: var(--color-text-primary); }
  .progress-bar { height: 3px; background: var(--color-border-tertiary); border-radius: 2px; margin-bottom: 1.5rem; }
  .progress-fill { height: 100%; background: #534AB7; border-radius: 2px; transition: width 0.3s; }
  .steps-section-label { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>Base de connaissances — eSupplier Connect / SPM</h1>
  <p class="subtitle">Capitalisation des retours d'expérience consultants — Milestone Readiness</p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('base', this)">Base de connaissances</button>
    <button class="tab" onclick="switchTab('diag', this)">Diagnostic rapide</button>
    <button class="tab" onclick="switchTab('saisie', this)">Ajouter un retour</button>
  </div>

  <div id="view-base" class="view active">
    <div class="metric-row">
      <div class="metric"><div class="metric-label">Problèmes documentés</div><div class="metric-value" id="stat-total">0</div></div>
      <div class="metric"><div class="metric-label">Résolus en réunion</div><div class="metric-value" id="stat-resolved">0</div></div>
      <div class="metric"><div class="metric-label">Catégories</div><div class="metric-value">4</div></div>
    </div>
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Rechercher un problème..." oninput="renderCards()" />
      <select class="filter-select" id="filter-cat" onchange="renderCards()">
        <option value="">Toutes les catégories</option>
        <option value="access">Accès eSupplier</option>
        <option value="spm">Application SPM</option>
        <option value="compte">Gestion de compte</option>
        <option value="autre">Autre</option>
      </select>
    </div>
    <div id="cards-container"></div>
  </div>

  <div id="view-diag" class="view">
    <div class="progress-bar"><div class="progress-fill" id="diag-progress" style="width:0%"></div></div>
    <div id="diag-container"></div>
  </div>

  <div id="view-saisie" class="view">
    <div class="form-grid">
      <div class="form-field full">
        <label>Titre du problème</label>
        <input type="text" id="f-title" placeholder="Ex: Le lien d'activation du compte ne fonctionne pas" />
      </div>
      <div class="form-field">
        <label>Catégorie</label>
        <select id="f-cat">
          <option value="access">Accès eSupplier</option>
          <option value="spm">Application SPM</option>
          <option value="compte">Gestion de compte</option>
          <option value="autre">Autre</option>
        </select>
      </div>
      <div class="form-field">
        <label>Résolu en réunion ?</label>
        <select id="f-resolved">
          <option value="yes">Oui</option>
          <option value="no">Non — escalade nécessaire</option>
        </select>
      </div>
      <div class="form-field full">
        <label>Description du problème</label>
        <textarea id="f-desc" placeholder="Décrivez le contexte et les symptômes observés..."></textarea>
      </div>
    </div>
    <div class="steps-section-label">Étapes de résolution</div>
    <div id="steps-builder"></div>
    <button class="btn-add" onclick="addStep()">+ Ajouter une étape</button>
    <div class="form-field" style="margin-bottom:1rem;">
      <label>Note / conseil consultant</label>
      <textarea id="f-note" placeholder="Ex: Vérifier d'abord si le fournisseur a bien reçu l'email d'invitation..."></textarea>
    </div>
    <button class="btn-primary" onclick="saveEntry()">Enregistrer ce retour</button>
    <div class="success-msg" id="success-msg">Retour enregistré avec succès dans la base de connaissances.</div>
  </div>
</div>

<script>
const CAT_LABELS = { access: 'Accès eSupplier', spm: 'Application SPM', compte: 'Gestion de compte', autre: 'Autre' };
const CAT_CLASSES = { access: 'cat-access', spm: 'cat-spm', compte: 'cat-compte', autre: 'cat-autre' };

let db = [
  { id: 1, cat: 'access', resolved: true, title: "Le fournisseur ne reçoit pas l'email d'invitation eSupplier Connect", desc: "Le fournisseur déclare ne jamais avoir reçu l'email contenant son lien d'activation et ses identifiants.", steps: ["Vérifier que l'adresse email saisie dans le système est correcte (faute de frappe fréquente).", "Demander au fournisseur de vérifier ses spams / courriers indésirables.", "Si absent, relancer l'envoi depuis la console admin eSupplier (option 'Renvoyer l'invitation').", "Si l'email n'arrive toujours pas, vérifier avec l'IT si le domaine de l'expéditeur est bloqué par leur pare-feu."], note: "80% des cas se résolvent à l'étape 2. Toujours demander au fournisseur de vérifier les spams avant de relancer.", count: 12 },
  { id: 2, cat: 'access', resolved: true, title: "Mot de passe oublié / compte bloqué après plusieurs tentatives", desc: "Le fournisseur ne parvient pas à se connecter, le compte est verrouillé après 3 essais infructueux.", steps: ["Utiliser la fonctionnalité 'Mot de passe oublié' sur la page de connexion eSupplier.", "Si le compte est bloqué (lockout), un admin doit le déverrouiller depuis le portail de gestion.", "Réinitialiser le mot de passe et s'assurer que le fournisseur respecte la politique de complexité (min. 8 caractères, 1 majuscule, 1 chiffre)."], note: "Ne pas tenter de déverrouiller depuis le compte fournisseur lui-même — seul l'admin peut le faire.", count: 8 },
  { id: 3, cat: 'spm', resolved: true, title: "L'application SPM ne s'affiche pas dans le portail eSupplier Connect", desc: "Le fournisseur est connecté à eSupplier Connect mais ne voit pas la tuile / l'accès à l'application SPM.", steps: ["Vérifier que le profil du fournisseur est bien rattaché au bon groupe de droits incluant SPM.", "Dans le back-office, aller dans Gestion des accès > Fournisseur > et assigner le rôle 'SPM_User'.", "Demander au fournisseur de se déconnecter puis de se reconnecter pour que les droits se propagent.", "Si le problème persiste, vider le cache du navigateur ou essayer un autre navigateur (Chrome recommandé)."], note: "Ce problème arrive souvent quand le fournisseur a été créé manuellement et non via le workflow standard d'onboarding.", count: 9 },
  { id: 4, cat: 'spm', resolved: false, title: "Erreur 403 à l'ouverture de SPM malgré un accès visible", desc: "Le fournisseur voit la tuile SPM mais obtient une erreur 403 (Forbidden) en cliquant dessus.", steps: ["Vérifier la date d'expiration du compte fournisseur dans eSupplier — un compte expiré génère un 403.", "Contrôler que le certificat SSO est toujours valide côté IdP.", "Escalader au support technique si les deux points précédents sont conformes."], note: "Ce cas nécessite souvent une intervention du support IT. Documenter l'heure exacte et le navigateur utilisé lors du signalement.", count: 3 },
  { id: 5, cat: 'compte', resolved: true, title: "Le fournisseur a changé d'adresse email et ne peut plus se connecter", desc: "Suite à un changement de contact chez le fournisseur, l'ancien email n'est plus actif.", steps: ["L'admin doit mettre à jour l'adresse email dans la fiche fournisseur dans eSupplier.", "Réinitialiser le mot de passe et envoyer une nouvelle invitation à la nouvelle adresse.", "Vérifier que l'ancienne adresse est bien désactivée pour éviter les conflits d'accès."], note: "Toujours confirmer l'identité du nouveau contact auprès du gestionnaire de compte fournisseur avant de modifier les accès.", count: 5 }
];

let steps = [''];

function switchTab(t, el) {
  document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.view').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('view-' + t).classList.add('active');
  if (t === 'base') renderCards();
  if (t === 'diag') { diagHistory = []; renderDiag(0); }
  if (t === 'saisie') initForm();
}

function renderCards() {
  const q = (document.getElementById('search-input').value || '').toLowerCase();
  const cat = document.getElementById('filter-cat').value;
  let items = db.filter(d => {
    const matchQ = !q || d.title.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q);
    const matchCat = !cat || d.cat === cat;
    return matchQ && matchCat;
  });
  document.getElementById('stat-total').textContent = db.length;
  document.getElementById('stat-resolved').textContent = db.filter(d => d.resolved).length;
  const c = document.getElementById('cards-container');
  if (!items.length) { c.innerHTML = '<div class="empty">Aucun problème ne correspond à la recherche.</div>'; return; }
  c.innerHTML = items.map(d => `
    <div class="problem-card" id="card-${d.id}" onclick="toggleCard(${d.id})">
      <div class="card-header">
        <span class="cat-badge ${CAT_CLASSES[d.cat]}">${CAT_LABELS[d.cat]}</span>
        <span class="card-title">${d.title}</span>
        <span class="expand-icon">▾</span>
      </div>
      <div class="card-meta">
        <span class="card-stat">Signalé <span>${d.count}x</span></span>
        <span class="card-stat">Résolution : <span style="color:${d.resolved ? '#27500A' : '#A32D2D'}">${d.resolved ? 'en réunion' : 'escalade'}</span></span>
      </div>
      <div class="card-body">
        <div class="section-label">Contexte</div>
        <p style="font-size:13px;color:var(--color-text-secondary);line-height:1.6">${d.desc}</p>
        <div class="section-label" style="margin-top:12px">Étapes de résolution</div>
        ${d.steps.map((s,i) => `<div class="solution-step"><div class="step-num">${i+1}</div><div>${s}</div></div>`).join('')}
        ${d.note ? `<div class="note-box">${d.note}</div>` : ''}
      </div>
    </div>`).join('');
}

function toggleCard(id) {
  document.getElementById('card-' + id).classList.toggle('expanded');
}

const diagTree = [
  { id: 0, q: "Quel est le type de problème rencontré ?", opts: [
    { label: "Le fournisseur ne reçoit pas l'email d'invitation", next: 1 },
    { label: "Le fournisseur ne peut pas se connecter (mot de passe / compte bloqué)", next: 2 },
    { label: "Connecté mais SPM n'est pas visible dans le portail", next: 3 },
    { label: "Visible mais erreur à l'ouverture de SPM", next: 4 },
    { label: "Changement de contact chez le fournisseur", next: 5 },
  ]},
  { id: 1, q: "L'adresse email saisie est-elle correcte ?", opts: [
    { label: "Oui, elle est correcte", next: 11 },
    { label: "Non / pas sûr", result: "Corriger l'adresse email dans la fiche fournisseur, puis relancer l'invitation depuis la console admin eSupplier." },
  ]},
  { id: 11, q: "Le fournisseur a-t-il vérifié ses spams ?", opts: [
    { label: "Oui, rien dans les spams", next: 12 },
    { label: "Non, pas encore", result: "Demander au fournisseur de vérifier ses dossiers spams / courriers indésirables. C'est la cause la plus fréquente (80% des cas)." },
  ]},
  { id: 12, result: "Relancer l'envoi depuis la console admin (option 'Renvoyer l'invitation'). Si l'email n'arrive toujours pas, vérifier avec l'IT du fournisseur si le domaine expéditeur est bloqué par leur pare-feu." },
  { id: 2, q: "Le compte est-il bloqué (message 'compte verrouillé') ?", opts: [
    { label: "Oui, compte verrouillé", result: "Un admin doit déverrouiller le compte depuis le portail de gestion. Ne pas tenter depuis le compte fournisseur. Puis réinitialiser le mot de passe." },
    { label: "Non, simple oubli de mot de passe", result: "Utiliser 'Mot de passe oublié' sur la page de connexion eSupplier. Vérifier que le nouveau mot de passe respecte la politique (8 car. min, 1 majuscule, 1 chiffre)." },
  ]},
  { id: 3, result: "Vérifier que le profil fournisseur est rattaché au groupe de droits incluant SPM. Assigner le rôle 'SPM_User' dans Gestion des accès. Demander au fournisseur de se reconnecter. Si persistant, vider le cache ou utiliser Chrome." },
  { id: 4, result: "Vérifier la date d'expiration du compte fournisseur (compte expiré = 403). Contrôler la validité du certificat SSO. Si tout est conforme, escalader au support IT en documentant l'heure et le navigateur utilisé." },
  { id: 5, result: "Mettre à jour l'adresse email dans la fiche fournisseur, réinitialiser le mot de passe, envoyer une nouvelle invitation. Désactiver l'ancienne adresse. Toujours confirmer l'identité du nouveau contact auprès du gestionnaire fournisseur." },
];

let diagHistory = [];

function renderDiag(nodeId) {
  const node = diagTree.find(n => n.id === nodeId);
  if (!node) return;
  const total = diagHistory.length + 1;
  document.getElementById('diag-progress').style.width = Math.min(total * 20, 90) + '%';
  const c = document.getElementById('diag-container');
  if (node.result) {
    document.getElementById('diag-progress').style.width = '100%';
    c.innerHTML = `<div class="diag-step">
      <div class="diag-result">
        <div class="diag-result-title">Solution recommandée</div>
        <div style="font-size:14px;color:#3C3489;line-height:1.6">${node.result}</div>
      </div>
      <button class="diag-back" onclick="resetDiag()">← Recommencer le diagnostic</button>
    </div>`;
    return;
  }
  c.innerHTML = `<div class="diag-step">
    <div class="diag-question">${node.q}</div>
    <div class="diag-options">
      ${node.opts.map((o,i) => `<button class="diag-opt" onclick="diagNext(${i}, ${nodeId})"><span class="diag-opt-icon"></span>${o.label}</button>`).join('')}
    </div>
    ${diagHistory.length > 0 ? '<button class="diag-back" onclick="diagBack()">← Retour</button>' : ''}
  </div>`;
  window._currentOpts = node.opts;
}

function diagNext(optIdx, fromId) {
  const opt = window._currentOpts[optIdx];
  diagHistory.push(fromId);
  if (opt.result) {
    const fakeId = 9000 + Date.now() % 1000;
    diagTree.push({ id: fakeId, result: opt.result });
    renderDiag(fakeId);
    setTimeout(() => { const i = diagTree.findIndex(n => n.id === fakeId); if (i > -1) diagTree.splice(i, 1); }, 500);
  } else {
    renderDiag(opt.next);
  }
}

function diagBack() {
  const prev = diagHistory.pop();
  renderDiag(prev);
}

function resetDiag() {
  diagHistory = [];
  renderDiag(0);
}

function initForm() {
  steps = [''];
  renderSteps();
  document.getElementById('f-title').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-note').value = '';
  document.getElementById('success-msg').style.display = 'none';
}

function renderSteps() {
  document.getElementById('steps-builder').innerHTML = steps.map((s, i) => `
    <div class="step-builder">
      <div class="step-builder-row">
        <div class="step-num" style="flex-shrink:0">${i+1}</div>
        <input type="text" value="${s.replace(/"/g,'&quot;')}" placeholder="Décrivez l'étape ${i+1}..." oninput="steps[${i}]=this.value" />
        ${steps.length > 1 ? `<button class="btn-remove" onclick="removeStep(${i})">×</button>` : ''}
      </div>
    </div>`).join('');
}

function addStep() { steps.push(''); renderSteps(); }
function removeStep(i) { steps.splice(i, 1); renderSteps(); }

function saveEntry() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); return; }
  db.unshift({
    id: Date.now(), cat: document.getElementById('f-cat').value,
    resolved: document.getElementById('f-resolved').value === 'yes',
    title, desc: document.getElementById('f-desc').value.trim(),
    steps: steps.filter(s => s.trim()),
    note: document.getElementById('f-note').value.trim(), count: 1
  });
  document.getElementById('success-msg').style.display = 'block';
  initForm();
}

renderCards();
renderDiag(0);
</script>
</body>
</html>
